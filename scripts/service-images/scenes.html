<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:750px;overflow:hidden;font-family:"Open Sans","Noto Sans","DejaVu Sans",Arial,sans-serif;color:#1c2333}
#stage{position:relative;width:1200px;height:750px;overflow:hidden}
/* backgrounds */
.bg-light{background:linear-gradient(180deg,#eef1f7 0%,#f7f8fc 58%,#d9c3a4 58.2%,#c5a982 100%)}
.bg-dark{background:linear-gradient(180deg,#1b2133 0%,#10141f 60%,#2a2d38 60.2%,#1b1d26 100%)}
.bg-soft{background:radial-gradient(circle at 25% 20%,#ffffff 0,#eef1f7 45%,#dfe4ef 100%)}
.bg-warm{background:radial-gradient(circle at 70% 25%,#fff7ec 0,#f4e7d6 55%,#e6d2b8 100%)}
.bg-ink{background:radial-gradient(circle at 30% 20%,#2a3350 0,#141a2b 60%,#0b0f1a 100%)}
.abs{position:absolute}
.sh{filter:drop-shadow(0 28px 26px rgba(10,15,30,.32)) drop-shadow(0 6px 8px rgba(10,15,30,.2))}
/* devices */
.laptop{position:absolute}
.laptop .lid{background:#0c0d11;border-radius:16px 16px 3px 3px;padding:12px 12px 16px;position:relative;box-shadow:inset 0 0 0 1.5px #2b2e38}
.laptop .cam{position:absolute;top:5px;left:50%;width:5px;height:5px;border-radius:50%;background:#2a2d36}
.laptop .screen{aspect-ratio:16/10;overflow:hidden;background:#fff;border-radius:2px;position:relative}
.laptop .base{height:15px;margin:0 -7%;background:linear-gradient(#d9dce2,#a5a9b2);border-radius:0 0 20px 20px;position:relative}
.laptop .base:after{content:"";position:absolute;left:50%;top:0;width:16%;height:6px;margin-left:-8%;background:#9094a0;border-radius:0 0 8px 8px}
.mon{position:absolute}
.mon .bezel{background:#101116;border-radius:12px;padding:10px 10px 26px;box-shadow:inset 0 0 0 1.5px #2b2e38}
.mon .screen{aspect-ratio:16/10;overflow:hidden;background:#fff;border-radius:2px;position:relative}
.mon .neck{width:90px;height:56px;margin:0 auto;background:linear-gradient(90deg,#9a9ea8,#d5d8de,#9a9ea8)}
.mon .foot{width:220px;height:10px;margin:0 auto;border-radius:6px;background:linear-gradient(#cfd2d9,#8e929c)}
.phone{position:absolute;border-radius:34px;background:#0c0d11;padding:8px;box-shadow:inset 0 0 0 1.5px #2f323c}
.phone .screen{border-radius:27px;overflow:hidden;background:#fff;width:100%;height:100%;position:relative}
.phone .pill{position:absolute;top:7px;left:50%;width:70px;height:18px;margin-left:-35px;border-radius:12px;background:#0c0d11;z-index:5}
.shot{width:100%;height:100%;background-repeat:no-repeat;background-size:100% auto;background-position:50% 0}
/* generic UI */
.row{display:flex}.col{display:flex;flex-direction:column}.c{align-items:center}.j{justify-content:center}.sb{justify-content:space-between}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(20,30,60,.12);padding:10px}
.sk{height:6px;border-radius:3px;background:#dfe3ec}.sk.d{background:#2c3550}
.pill2{padding:2px 8px;border-radius:9px;font-size:8px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.t{font-weight:700}
.sidebar{background:#141a2e;width:15%;padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.sidebar i{display:block;height:8px;border-radius:4px;background:#2b3558}
.sidebar i.on{background:#ff4a1c}
.topbar{height:26px;background:#fff;border-bottom:1px solid #e6e9f2;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
svg text{font-family:inherit}
code,.code{font-family:"DejaVu Sans Mono","Courier New",monospace}
</style></head>
